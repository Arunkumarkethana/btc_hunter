[package]
name = "btc_hunter"
version = "0.1.0"
edition = "2021"

[dependencies]
secp256k1 = { version = "0.29", features = ["rand", "global-context"] }
bitcoin = "0.32"
rayon = "1.8"
hex = "0.4"
rand = "0.8"
reqwest = { version = "0.11", features = ["blocking", "json"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ripemd = "0.1"
sha2 = { version = "0.10", features = ["asm"] }
bs58 = "0.5.1"
bloomfilter = "3.0.1"
bech32 = "0.11.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
